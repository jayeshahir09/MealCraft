# ==========================================
#  AI Recipe & Meal Planner - Application Config
# ==========================================

# Server
server.port=8080

# ---- Database ----
spring.datasource.url=jdbc:postgresql://localhost:5432/mealplanner
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT ----
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# ---- OpenRouter (LLM) ----
openrouter.api.key=${OPENROUTER_API_KEY}
openrouter.api.base-url=https://openrouter.ai/api/v1
# Models tried in order on 429/404/503 — all confirmed free as of 2026-08-02
openrouter.models=openai/gpt-oss-20b:free,inclusionai/ling-3.0-flash:free,nvidia/nemotron-3-super-120b-a12b:free,google/gemma-4-31b-it:free
openrouter.timeout-seconds=30

# ---- Rate Limiting ----
ai.rate-limit.calls-per-day=20

# ---- Cache (Caffeine) ----
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=200,expireAfterWrite=3600s
