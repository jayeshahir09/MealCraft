# ==========================================
#  AI Recipe & Meal Planner - Application Config
# ==========================================

# Server
server.port=${PORT:8080}

# ---- Database ----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA ----
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---- Database Migrations (Flyway) ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1

# ---- JWT ----
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRE:43200000}

# ---- OpenRouter (LLM) ----
openrouter.api.key=${OPENROUTER_API_KEY:}
openrouter.api.base-url=https://openrouter.ai/api/v1
openrouter.models=${MODEL_NAME:openrouter/free,meta-llama/llama-3.3-70b-instruct:free,google/gemma-2-9b-it:free,mistralai/mistral-7b-instruct:free,qwen/qwen-2.5-72b-instruct:free}
openrouter.timeout-seconds=${TIMEOUT_SECONDS:35}

# ---- Rate Limiting ----
ai.rate-limit.calls-per-day=${AI_CALL_LIMIT:20}

# ---- CORS ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---- Cache (Caffeine) ----
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=200,expireAfterWrite=3600s

# ---- Email / SMTP Configuration ----
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:no-reply@mealcraft.app}

# ---- OTP Configuration ----
app.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:10}
app.otp.cooldown-seconds=${OTP_COOLDOWN_SECONDS:60}
app.otp.max-attempts=${OTP_MAX_ATTEMPTS:5}
app.otp.max-requests-per-hour=${OTP_MAX_REQUESTS_PER_HOUR:5}
