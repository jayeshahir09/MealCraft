# ==========================================
#  AI Recipe & Meal Planner - Application Config
# ==========================================

# Server
server.port=8080

# ---- Database ----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA ----
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---- Database Migrations (Flyway) ----
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1

# ---- JWT ----
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRE:86400000}

# ---- OpenRouter (LLM) ----
openrouter.api.key=${OPENROUTER_API_KEY}
openrouter.api.base-url=https://openrouter.ai/api/v1
openrouter.models=${MODEL_NAME:openrouter/free,minimax/minimax-m3:free}
openrouter.timeout-seconds=${TIMEOUT_SECONDS:30}

# ---- Rate Limiting ----
ai.rate-limit.calls-per-day=${AI_CALL_LIMIT:20}

# ---- CORS ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# ---- Cache (Caffeine) ----
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=200,expireAfterWrite=3600s
