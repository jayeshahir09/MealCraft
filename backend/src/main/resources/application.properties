# ==========================================
#  AI Recipe & Meal Planner - Application Config
# ==========================================

# Server
server.port=8080

# ---- Database ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mealplanner}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---- JPA ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT ----
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# ---- OpenRouter (LLM) ----
openrouter.api.key=${OPENROUTER_API_KEY}
openrouter.api.base-url=https://openrouter.ai/api/v1
openrouter.model=mistralai/mistral-7b-instruct
openrouter.timeout-seconds=30

# ---- Rate Limiting ----
ai.rate-limit.calls-per-day=20

# ---- Cache (Caffeine) ----
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=200,expireAfterWrite=3600s
